<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiches projet</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
  header { background: #1f3b57; color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  header a { color: #fff; }
  main { max-width: 980px; margin: auto; padding: 16px; }
  .carte { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
  input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 15px; }
  td input, td select { width: auto; margin: 0; padding: 5px; font-size: 13px; }
  button, .btn { display: inline-block; padding: 8px 14px; margin: 6px 6px 0 0; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; text-decoration: none; }
  .bleu { background: #1f3b57; color: #fff; }
  .rouge { background: #c62828; color: #fff; }
  .gris { background: #ddd; color: #222; }
  .orange { background: #ef6c00; color: #fff; }
  .petit { padding: 3px 8px; font-size: 12px; margin: 2px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  td, th { padding: 6px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; vertical-align: middle; }
  .modif { color: #1565c0; font-size: 12px; font-weight: bold; }
  .incoherent { background: #fff3e0; }
  .alerte { color: #e65100; font-size: 12px; font-weight: bold; }
  .proche { background: #ff1744; }
  .proche td, .proche .alerte { color: #fff; }
  .retard { background: #000; }
  .retard td, .retard .alerte { color: #fff; }
  .fait td { color: #999; }
  .avert { background: #fff3e0; border-left: 4px solid #e65100; padding: 8px; margin-top: 8px; font-size: 14px; }
  .liste-fiche { cursor: pointer; padding: 10px; border-bottom: 1px solid #eee; }
  .liste-fiche:hover { background: #f0f4f8; }
  .statut { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #e3eaf2; margin-left: 6px; }
  .resp { display: grid; grid-template-columns: 2fr 2fr 2fr 1.5fr auto; gap: 6px; margin-top: 6px; }
  .resp input { margin: 0; }
  .defile { overflow-x: auto; }
  h2 { margin-top: 0; }
</style>
</head>
<body>
<header>
  <strong>Fiches projet</strong>
  <a href="index.html">← Retour à la veille</a>
</header>
<main>

<div class="carte" id="vueListe">
  <h2>Mes fiches</h2>
  <button class="bleu" onclick="nouvelleFiche()">+ Nouvelle fiche</button>
  <div id="liste"></div>
</div>

<div class="carte" id="vueFiche" style="display:none">
  <button class="gris" onclick="retourListe()">← Toutes les fiches</button>
  <h2>Fiche projet</h2>

  <label>Intitulé du marché</label>
  <input id="f_titre" oninput="champ('titre', this.value)">
  <label>Acheteur</label>
  <input id="f_acheteur" oninput="champ('acheteur', this.value)">
  <label>Lien de l'annonce</label>
  <input id="f_lien" oninput="champ('lien', this.value)">
  <label>Statut</label>
  <select id="f_statut" onchange="champ('statut', this.value); dessiner()">
    <option>Réponse en cours</option>
    <option>Offre déposée</option>
    <option>Marché gagné</option>
    <option>Marché perdu</option>
  </select>
  <label>Notes</label>
  <textarea id="f_notes" rows="3" oninput="champ('notes', this.value)"></textarea>

  <h3>Responsables</h3>
  <p style="font-size:13px;color:#666;margin:0">Bureau d'études, commission de sécurité, chef de chantier… Saisis une fois, puis choisis pour chaque étape.</p>
  <div id="responsables"></div>
  <button class="gris" onclick="ajouterResp()">+ Ajouter un responsable</button>

  <label>Alerter combien de jours avant l'échéance ?</label>
  <input type="number" id="f_delai" min="1" max="60" style="width:100px" onchange="champ('delai', parseInt(this.value) || 7); dessiner()">

  <h3>Phase 1 — Réponse à l'appel d'offres</h3>
  <label>Date limite de remise des offres</label>
  <input type="date" id="f_remise" onchange="champ('remise', this.value); dessiner()">
  <div id="avert1"></div>
  <div class="defile"><table id="tab1"></table></div>

  <div id="phase2">
    <h3>Phase 2 — Marché gagné</h3>
    <label>Date de l'événement</label>
    <input type="date" id="f_evenement" onchange="champ('evenement', this.value); dessiner()">
    <div id="avert2"></div>
    <div class="defile"><table id="tab2"></table></div>
  </div>
  <p id="info2" style="color:#666;font-size:14px"></p>

  <button class="rouge" onclick="supprimerFiche()">Supprimer cette fiche</button>
</div>

</main>
<script>
const PHASE1 = [
  { id: "cdc", nom: "Lecture du cahier des charges", j: -21 },
  { id: "visite", nom: "Visite du site", j: -18 },
  { id: "be", nom: "Étude du bureau d'études (plans, notes de calcul)", j: -14 },
  { id: "chiffrage", nom: "Chiffrage", j: -7 },
  { id: "admin", nom: "Papiers administratifs", j: -4 },
  { id: "depot", nom: "Dépôt de l'offre", j: -1 }
];
const PHASE2 = [
  { id: "securite", nom: "Sécurité", j: -30 },
  { id: "ppsps", nom: "PPSPS", j: -21 },
  { id: "prevention", nom: "Plan de prévention", j: -14 },
  { id: "materiel", nom: "Matériel et camions", j: -7 },
  { id: "montage", nom: "Montage", j: -3 },
  { id: "evenement", nom: "Événement", j: 0 },
  { id: "demontage", nom: "Démontage", j: 1 }
];

let fiches = JSON.parse(localStorage.getItem("fiches") || "[]");
let courante = null;

function sauver() { localStorage.setItem("fiches", JSON.stringify(fiches)); }
function auj() { return new Date().toISOString().slice(0, 10); }
function decaler(date, jours) {
  const d = new Date(date + "T12:00:00");
  d.setDate(d.getDate() + jours);
  return d.toISOString().slice(0, 10);
}
function ecart(date) { return Math.round((new Date(date + "T12:00:00") - new Date(auj() + "T12:00:00")) / 86400000); }
function fr(date) { return date ? date.split("-").reverse().join("/") : "—"; }
function esc(t) { return (t || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }
function fiche() { return fiches.find(f => f.id === courante); }

function completer(f) {
  f.manuel = f.manuel || {}; f.fait = f.fait || {};
  f.resp = f.resp || []; f.affect = f.affect || {};
  if (!f.delai) f.delai = 7;
  return f;
}

function creer(donnees) {
  const f = completer(Object.assign({
    id: Date.now().toString(), titre: "", acheteur: "", lien: "", statut: "Réponse en cours",
    notes: "", remise: "", evenement: ""
  }, donnees));
  fiches.unshift(f); sauver(); ouvrir(f.id);
}
function nouvelleFiche() { creer({}); }
function champ(nom, valeur) { fiche()[nom] = valeur; sauver(); }

function ouvrir(id) {
  courante = id;
  const f = completer(fiche());
  document.getElementById("vueListe").style.display = "none";
  document.getElementById("vueFiche").style.display = "block";
  ["titre", "acheteur", "lien", "statut", "notes", "remise", "evenement", "delai"].forEach(c =>
    document.getElementById("f_" + c).value = f[c] || "");
  dessinerResp();
  dessiner();
}

function retourListe() {
  courante = null;
  document.getElementById("vueFiche").style.display = "none";
  document.getElementById("vueListe").style.display = "block";
  afficherListe();
}

function supprimerFiche() {
  if (!confirm("Supprimer définitivement cette fiche ?")) return;
  fiches = fiches.filter(f => f.id !== courante); sauver(); retourListe();
}

function ajouterResp() {
  fiche().resp.push({ id: Date.now().toString(), nom: "", role: "", mail: "", tel: "" });
  sauver(); dessinerResp(); dessiner();
}
function modifResp(i, cle, val) { fiche().resp[i][cle] = val; sauver(); dessiner(); }
function supprimerResp(i) {
  const f = fiche(); const rid = f.resp[i].id;
  f.resp.splice(i, 1);
  Object.keys(f.affect).forEach(k => { if (f.affect[k] === rid) delete f.affect[k]; });
  sauver(); dessinerResp(); dessiner();
}
function dessinerResp() {
  const f = fiche();
  document.getElementById("responsables").innerHTML = f.resp.map((r, i) => `
    <div class="resp">
      <input placeholder="Nom" value="${esc(r.nom)}" oninput="modifResp(${i}, 'nom', this.value)">
      <input placeholder="Rôle (BE, sécurité, chef de chantier…)" value="${esc(r.role)}" oninput="modifResp(${i}, 'role', this.value)">
      <input type="email" placeholder="Mail" value="${esc(r.mail)}" oninput="modifResp(${i}, 'mail', this.value)">
      <input type="tel" placeholder="Téléphone" value="${esc(r.tel)}" oninput="modifResp(${i}, 'tel', this.value)">
      <button class="rouge petit" onclick="supprimerResp(${i})">✕</button>
    </div>`).join("");
}
function affecter(etape, rid) {
  const f = fiche();
  if (rid) f.affect[etape] = rid; else delete f.affect[etape];
  sauver(); dessiner();
}

function message(f, e, d) {
  return `Bonjour, rappel pour le marché « ${f.titre || "sans titre"} »${f.acheteur ? " (" + f.acheteur + ")" : ""} : l'étape « ${e.nom} » est prévue pour le ${fr(d)}. Merci de me confirmer où vous en êtes. Cécile`;
}
function liensAlerte(f, e, d, r) {
  if (!r) return "";
  const txt = message(f, e, d);
  let h = "";
  if (r.mail) h += `<a class="btn orange petit" href="mailto:${encodeURIComponent(r.mail)}?subject=${encodeURIComponent("Rappel : " + e.nom + " — " + (f.titre || "marché"))}&body=${encodeURIComponent(txt)}">Mail</a>`;
  if (r.tel) h += `<a class="btn orange petit" href="sms:${r.tel.replace(/\s/g, "")}?&body=${encodeURIComponent(txt)}">SMS</a>`;
  if (r.tel) h += `<a class="btn bleu petit" href="tel:${r.tel.replace(/\s/g, "")}">Appeler</a>`;
  return h;
}

function dateEtape(f, e, ref) {
  if (f.manuel[e.id]) return f.manuel[e.id];
  return ref ? decaler(ref, e.j) : "";
}

function tableau(idTab, etapes, ref, phase) {
  const f = fiche();
  let html = "<tr><th>Fait</th><th>Étape</th><th>Date</th><th>Responsable</th><th>Alerte</th></tr>";
  let precedente = "";
  etapes.forEach(e => {
    const d = dateEtape(f, e, ref);
    const fait = f.fait[e.id];
    const r = f.resp.find(x => x.id === f.affect[e.id]);
    let alertes = [];
    if (d && precedente && d < precedente) alertes.push("avant l'étape précédente");
    if (d && phase === 1 && f.remise && d > f.remise) alertes.push("après la date de remise");
    if (d && phase === 2 && f.remise && d <= f.remise) alertes.push("avant la remise des offres");
    const jours = d ? ecart(d) : null;
    const retard = d && !fait && jours < 0;
    const proche = d && !fait && jours >= 0 && jours <= f.delai;
    let classe = "";
    if (fait) classe = "fait";
    else if (alertes.length) classe = "incoherent";
    else if (retard) classe = "retard";
    else if (proche) classe = "proche";

    let etat = "";
    if (!fait && retard) etat = '<span class="alerte">en retard</span>';
    else if (!fait && proche) etat = `<span class="alerte">dans ${jours} j</span>`;

    const choix = `<select onchange="affecter('${e.id}', this.value)"><option value="">—</option>` +
      f.resp.map(x => `<option value="${x.id}" ${x.id === f.affect[e.id] ? "selected" : ""}>${esc(x.nom || x.role || "sans nom")}</option>`).join("") +
      "</select>";

    html += `<tr class="${classe}">
      <td><input type="checkbox" ${fait ? "checked" : ""} onchange="cocher('${e.id}', this.checked)"></td>
      <td>${e.nom} ${etat}
        ${alertes.length ? '<br><span class="alerte">⚠ ' + alertes.join(", ") + "</span>" : ""}</td>
      <td><input type="date" value="${d}" onchange="modifierDate('${e.id}', this.value)">
        ${f.manuel[e.id] ? '<br><span class="modif">modifiée</span> <button class="gris petit" onclick="remettreAuto(\'' + e.id + '\')">auto</button>' : ""}</td>
      <td>${choix}</td>
      <td>${(proche || retard) ? liensAlerte(f, e, d, r) : ""}</td>
    </tr>`;
    if (d) precedente = d;
  });
  document.getElementById(idTab).innerHTML = html;
}

function cocher(id, val) { fiche().fait[id] = val; sauver(); dessiner(); }
function modifierDate(id, val) {
  const f = fiche();
  if (val) f.manuel[id] = val; else delete f.manuel[id];
  sauver(); dessiner();
}
function remettreAuto(id) { delete fiche().manuel[id]; sauver(); dessiner(); }

function dessiner() {
  const f = fiche();
  tableau("tab1", PHASE1, f.remise, 1);
  document.getElementById("avert1").innerHTML = !f.remise
    ? '<div class="avert">Indiquez la date de remise pour calculer les étapes.</div>'
    : (f.remise < auj() && f.statut === "Réponse en cours" ? '<div class="avert">La date de remise est dépassée.</div>' : "");

  const gagne = f.statut === "Marché gagné";
  document.getElementById("phase2").style.display = gagne ? "block" : "none";
  document.getElementById("info2").textContent = gagne ? "" : "La phase 2 s'affiche quand le statut passe à « Marché gagné ».";
  if (gagne) {
    tableau("tab2", PHASE2, f.evenement, 2);
    document.getElementById("avert2").innerHTML = !f.evenement
      ? '<div class="avert">Indiquez la date de l\'événement pour calculer les étapes.</div>'
      : (f.remise && f.evenement <= f.remise ? '<div class="avert">L\'événement est avant ou le jour de la remise des offres : vérifiez les dates.</div>' : "");
  }
}

function afficherListe() {
  const div = document.getElementById("liste");
  if (!fiches.length) { div.innerHTML = "<p>Aucune fiche pour le moment.</p>"; return; }
  div.innerHTML = fiches.map(f => `<div class="liste-fiche" onclick="ouvrir('${f.id}')">
    <strong>${esc(f.titre) || "Sans titre"}</strong><span class="statut">${f.statut}</span><br>
    <small>${esc(f.acheteur)} — remise : ${fr(f.remise)}${f.evenement ? " — événement : " + fr(f.evenement) : ""}</small>
  </div>`).join("");
}

const p = new URLSearchParams(location.search);
if (p.get("titre")) {
  creer({ titre: p.get("titre") || "", acheteur: p.get("acheteur") || "",
          lien: p.get("lien") || "", remise: p.get("remise") || "" });
  history.replaceState(null, "", "projet.html");
} else {
  afficherListe();
}
</script>
</body>
</html>
