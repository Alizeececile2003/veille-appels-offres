<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiches projet</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
  header { background: #1f3b57; color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  header a { color: #fff; }
  main { max-width: 980px; margin: auto; padding: 16px; }
  .carte { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
  input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 15px; }
  button, .btn { display: inline-block; padding: 8px 14px; margin: 6px 6px 0 0; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; text-decoration: none; }
  .bleu { background: #1f3b57; color: #fff; }
  .rouge { background: #c62828; color: #fff; }
  .gris { background: #ddd; color: #222; }
  .orange { background: #ef6c00; color: #fff; }
  .petit { padding: 5px 10px; font-size: 13px; margin: 2px 4px 2px 0; }
  .bloc { border-left: 4px solid #1f3b57; background: #f0f4f8; padding: 10px 12px; margin-top: 14px; border-radius: 4px; }
  .bloc h3 { margin: 0 0 2px; font-size: 16px; }
  .petitgris { font-size: 13px; color: #555; }
  .grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-top: 6px; }
  .grille input { margin: 0; }
  .etape { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-top: 10px; background: #fff; }
  .etape h4 { margin: 0 0 4px; font-size: 16px; }
  .contenu { font-size: 13px; color: #555; margin: 0 0 6px; }
  .ligne { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
  .ligne input, .ligne select { width: auto; flex: 1 1 150px; margin: 0; }
  .modif { color: #1565c0; font-size: 12px; font-weight: bold; }
  .alerte { color: #e65100; font-size: 13px; font-weight: bold; }
  .suiveur { font-size: 14px; margin-top: 6px; }
  .vert { background: #e8f5e9; border-color: #43a047; }
  .vert h4 { text-decoration: line-through; color: #2e7d32; }
  .manquant { background: #ffe0b2; border-color: #ef6c00; }
  .proche { background: #ff1744; border-color: #ff1744; color: #fff; }
  .retard { background: #000; border-color: #000; color: #fff; }
  .proche .contenu, .proche .alerte, .proche .modif, .retard .contenu, .retard .alerte, .retard .modif { color: #fff; }
  .sous { font-weight: bold; color: #1f3b57; margin-top: 16px; font-size: 15px; }
  .avert { background: #fff3e0; border-left: 4px solid #e65100; padding: 8px; margin-top: 8px; font-size: 14px; }
  .liste-fiche { cursor: pointer; padding: 10px; border-bottom: 1px solid #eee; }
  .liste-fiche:hover { background: #f0f4f8; }
  .statut { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #e3eaf2; margin-left: 6px; }
  h2 { margin-top: 0; }
</style>
</head>
<body>
<header>
  <strong>Fiches projet</strong>
  <a href="index.html">← Retour à la veille</a>
</header>
<main>

<div class="carte" id="vueListe">
  <h2>Mes fiches</h2>
  <button class="bleu" onclick="nouvelleFiche()">+ Nouvelle fiche</button>
  <div id="liste"></div>
</div>

<div class="carte" id="vueFiche" style="display:none">
  <button class="gris" onclick="retourListe()">← Toutes les fiches</button>
  <h2>Fiche projet</h2>

  <label>Nom du projet</label>
  <input id="f_titre" oninput="champ('titre', this.value)">
  <label>Client</label>
  <input id="f_acheteur" oninput="champ('acheteur', this.value)">
  <label>Date de remise de l'offre</label>
  <input type="date" id="f_remise" onchange="champ('remise', this.value); dessiner()">
  <label>Date de l'événement</label>
  <input type="date" id="f_evenement" onchange="champ('evenement', this.value); dessiner()">
  <label>Lien de l'annonce</label>
  <input id="f_lien" oninput="champ('lien', this.value)">
  <label>Notes</label>
  <textarea id="f_notes" rows="3" oninput="champ('notes', this.value)"></textarea>

  <div class="bloc">
    <h3>Chargé d'affaires</h3>
    <div class="petitgris">Responsable du dossier en phase 1</div>
    <div class="grille">
      <input id="ca_nom" placeholder="Prénom et nom" oninput="contactSuivi('ca', 'nom', this.value)" onchange="dessiner()">
      <input id="ca_tel" type="tel" placeholder="Téléphone" oninput="contactSuivi('ca', 'tel', this.value)">
      <input id="ca_mail" type="email" placeholder="Mail" oninput="contactSuivi('ca', 'mail', this.value)">
    </div>
  </div>

  <div class="bloc" id="blocCP">
    <h3>Chef de projet</h3>
    <div class="petitgris">Responsable du dossier en phase 2</div>
    <div class="grille">
      <input id="cp_nom" placeholder="Prénom et nom" oninput="contactSuivi('cp', 'nom', this.value)" onchange="dessiner()">
      <input id="cp_tel" type="tel" placeholder="Téléphone" oninput="contactSuivi('cp', 'tel', this.value)">
      <input id="cp_mail" type="email" placeholder="Mail" oninput="contactSuivi('cp', 'mail', this.value)">
    </div>
  </div>

  <label>Alerter combien de jours avant l'échéance ?</label>
  <input type="number" id="f_delai" min="1" max="60" style="width:100px" onchange="champ('delai', parseInt(this.value) || 7); dessiner()">

  <h3>Phase 1 — Réponse à l'appel d'offres</h3>
  <div id="avert1"></div>
  <div id="etapes1"></div>

  <div id="phase2">
    <h3>Phase 2 — Marché gagné</h3>
    <div id="avert2"></div>
    <div id="etapes2"></div>
  </div>
  <p id="info2" style="color:#666;font-size:14px"></p>

  <div class="bloc">
    <h3>Bilan</h3>
    <label>Résultat</label>
    <select id="f_resultat" onchange="champ('resultat', this.value); dessiner()">
      <option>En cours</option>
      <option>Gagné</option>
      <option>Perdu</option>
    </select>
    <label>Motif</label>
    <select id="f_motif" onchange="champ('motif', this.value)">
      <option value="">—</option>
      <option>Prix</option>
      <option>Délai</option>
      <option>Dossier incomplet</option>
      <option>Autre</option>
    </select>
    <label>Commentaire</label>
    <textarea id="f_commentaire" rows="3" oninput="champ('commentaire', this.value)"></textarea>
  </div>

  <button class="rouge" onclick="supprimerFiche()">Supprimer cette fiche</button>
</div>

</main>
<script>
const PHASE1 = [
  { id: "prep", nom: "Préparation", resp: "Chargé d'affaires", contenu: "Lecture du dossier de consultation (DCE) et du cahier des charges, visite du site", j: -21 },
  { id: "calculs", nom: "Calculs", resp: "Bureau d'études / ingénieur structure", contenu: "Plans et notes de calcul demandés au bureau d'études, descente de charges, plan d'implantation, étude au vent, validation par le bureau de contrôle", j: -14 },
  { id: "securite", nom: "Sécurité", resp: "QSE", contenu: "Habilitations et CACES des monteurs", j: -10 },
  { id: "admin", nom: "Pièces administratives", resp: "Chargé d'affaires", contenu: "DC1, DC2 ou DUME, Kbis de moins de 3 mois, attestation URSSAF, régularité fiscale, RC pro, décennale, RIB, références de chantiers similaires, certificats de qualification, acte d'engagement", j: -7 },
  { id: "offre", nom: "Offre technique et financière", resp: "Chargé d'affaires et bureau d'études", contenu: "Mémoire technique, BPU ou DPGF, planning prévisionnel, liste du matériel, jalonnement (moyens humains)", j: -3 },
  { id: "depot", nom: "Remise de l'offre", resp: "Chargé d'affaires", contenu: "Dépôt de l'offre", j: 0 }
];
const PHASE2 = [
  { id: "pgc", nom: "PGC (plan général de coordination)", resp: "Chef de projet", contenu: "", j: -30, secu: true },
  { id: "ppsps", nom: "PPSPS", resp: "Chef de projet", contenu: "Comprend le plan prévisionnel signé", j: -21, secu: true },
  { id: "prevention", nom: "Plan de prévention", resp: "Chef de projet", contenu: "", j: -14, secu: true },
  { id: "methodo", nom: "Méthodologie de travail", resp: "Chef de projet", contenu: "", j: -14, secu: true },
  { id: "attestation", nom: "Attestation de bon montage", resp: "Chef de chantier", contenu: "Signée par le chef de chantier, remise au client, qui la transmet au bureau de contrôle avec la note de calcul et les plans", j: -2 }
];
const ETATS = ["À faire", "En cours", "Document manquant", "Fait", "Validé"];

let fiches = [];
let courante = null;

/* ---------- Dates en heure locale ---------- */
function pad(n) { return String(n).padStart(2, "0"); }
function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function auj() { return iso(new Date()); }
function versDate(s) { const [a, m, j] = s.split("-").map(Number); return new Date(a, m - 1, j); }
function decaler(s, n) { const d = versDate(s); d.setDate(d.getDate() + n); return iso(d); }
function ecart(s) { return Math.round((versDate(s) - versDate(auj())) / 86400000); }
function fr(s) { return s ? s.split("-").reverse().join("/") : "—"; }
function esc(t) { return (t || "").toString().replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

function sauver() { localStorage.setItem("fiches", JSON.stringify(fiches)); }
function fiche() { return fiches.find(f => f.id === courante); }

/* ---------- Réparation automatique des anciennes fiches ---------- */
function completer(f) {
  f.etat = f.etat || {}; f.manuel = f.manuel || {}; f.contact = f.contact || {};
  f.ca = f.ca || { nom: "", tel: "", mail: "" };
  f.cp = f.cp || { nom: "", tel: "", mail: "" };
  f.resultat = f.resultat || "En cours";
  f.motif = f.motif || ""; f.commentaire = f.commentaire || "";
  if (!f.delai) f.delai = 7;
  return f;
}

function reparer(f) {
  if (f && f.v === 2) return completer(f);
  f = f || {};
  const ancien = JSON.parse(JSON.stringify(f));
  const n = {
    v: 2,
    id: f.id || (Date.now().toString() + Math.floor(Math.random() * 100000)),
    titre: f.titre || f.nom || "",
    acheteur: f.acheteur || f.client || "",
    lien: f.lien || "",
    notes: f.notes || "",
    remise: f.remise || "",
    evenement: f.evenement || f.date || "",
    delai: f.delai || 7,
    resultat: f.statut === "Marché gagné" ? "Gagné" : (f.statut === "Marché perdu" ? "Perdu" : "En cours"),
    etat: {}, contact: {}, manuel: {}
  };
  if (Array.isArray(f.etapes)) {
    const r = f.etapes.find(e => e.t === "Remise de l'offre");
    if (r && !n.remise) n.remise = r.d;
    const plus = [f.lieu ? "Lieu : " + f.lieu : "", f.contraintes ? "Contraintes : " + f.contraintes : ""].filter(Boolean).join("\n");
    if (plus) n.notes = n.notes ? n.notes + "\n" + plus : plus;
  }
  const corresp = { prep: ["cdc", "visite"], calculs: ["be"], offre: ["chiffrage"], admin: ["admin"], depot: ["depot"], ppsps: ["ppsps"], prevention: ["prevention"] };
  const fait = f.fait || {}, resp = f.resp || [], affect = f.affect || {};
  Object.keys(corresp).forEach(neu => {
    const olds = corresp[neu];
    if (olds.every(o => fait[o])) n.etat[neu] = "Fait";
    else if (olds.some(o => fait[o])) n.etat[neu] = "En cours";
    olds.forEach(o => {
      const r = resp.find(x => x.id === affect[o]);
      if (r && !n.contact[neu]) n.contact[neu] = { poste: r.role || "", nom: r.nom || "", tel: r.tel || "", mail: r.mail || "" };
    });
  });
  n.ancien = ancien;
  return completer(n);
}

/* ---------- Fiches ---------- */
function creer(donnees) {
  const f = completer(Object.assign({
    v: 2, id: Date.now().toString(), titre: "", acheteur: "", lien: "", notes: "", remise: "", evenement: ""
  }, donnees));
  fiches.unshift(f); sauver(); ouvrir(f.id);
}
function nouvelleFiche() { creer({}); }
function champ(nom, valeur) { fiche()[nom] = valeur; sauver(); }
function contactSuivi(qui, cle, val) { fiche()[qui][cle] = val; sauver(); }
function modifContact(id, cle, val) {
  const f = fiche();
  f.contact[id] = f.contact[id] || {};
  f.contact[id][cle] = val;
  sauver();
}
function setEtat(id, val) { fiche().etat[id] = val; sauver(); dessiner(); }
function modifierDate(id, val) {
  const f = fiche();
  if (val) f.manuel[id] = val; else delete f.manuel[id];
  sauver(); dessiner();
}
function remettreAuto(id) { delete fiche().manuel[id]; sauver(); dessiner(); }

function ouvrir(id) {
  courante = id;
  const f = fiche();
  if (!f) return;
  document.getElementById("vueListe").style.display = "none";
  document.getElementById("vueFiche").style.display = "block";
  ["titre", "acheteur", "lien", "notes", "remise", "evenement", "delai", "resultat", "motif", "commentaire"].forEach(c =>
    document.getElementById("f_" + c).value = f[c] || "");
  ["nom", "tel", "mail"].forEach(c => {
    document.getElementById("ca_" + c).value = f.ca[c] || "";
    document.getElementById("cp_" + c).value = f.cp[c] || "";
  });
  dessiner();
  window.scrollTo(0, 0);
}

function retourListe() {
  courante = null;
  document.getElementById("vueFiche").style.display = "none";
  document.getElementById("vueListe").style.display = "block";
  afficherListe();
}

function supprimerFiche() {
  if (!confirm("Supprimer définitivement cette fiche ?")) return;
  fiches = fiches.filter(f => f.id !== courante); sauver(); retourListe();
}

/* ---------- Étapes ---------- */
function dateEtape(f, e, ref) {
  if (f.manuel[e.id]) return f.manuel[e.id];
  return ref ? decaler(ref, e.j) : "";
}

function carte(f, e, ref, phase, precedente) {
  const d = dateEtape(f, e, ref);
  const etat = f.etat[e.id] || "À faire";
  const fini = etat === "Fait" || etat === "Validé";
  const jours = d ? ecart(d) : null;
  const retard = !!d && !fini && jours < 0;
  const proche = !!d && !fini && jours >= 0 && jours <= f.delai;

  let classe = "";
  if (fini) classe = "vert";
  else if (retard) classe = "retard";
  else if (proche) classe = "proche";
  else if (etat === "Document manquant") classe = "manquant";

  const alertes = [];
  if (d && precedente && d < precedente) alertes.push("avant l'étape précédente");
  if (d && phase === 1 && f.remise && d > f.remise) alertes.push("après la date de remise");
  if (d && phase === 2 && f.remise && d <= f.remise) alertes.push("avant la remise des offres");

  let quand = "";
  if (retard) quand = `<span class="alerte">en retard de ${-jours} j</span>`;
  else if (proche) quand = `<span class="alerte">${jours === 0 ? "aujourd'hui" : "dans " + jours + " j"}</span>`;

  const suiveur = phase === 1 ? "Chargé d'affaires" : "Chef de projet";
  let resp;
  if (e.resp === suiveur) {
    const c = phase === 1 ? f.ca : f.cp;
    resp = `<div class="suiveur">Responsable : <b>${suiveur}</b>${c.nom ? " — " + esc(c.nom) : ""} (suit le dossier)</div>`;
  } else {
    const c = f.contact[e.id] || {};
    const poste = c.poste !== undefined ? c.poste : e.resp;
    resp = `<div class="ligne">
        <input placeholder="Poste" value="${esc(poste)}" oninput="modifContact('${e.id}', 'poste', this.value)">
        <input placeholder="Prénom et nom" value="${esc(c.nom)}" oninput="modifContact('${e.id}', 'nom', this.value)">
        <input type="tel" placeholder="Téléphone" value="${esc(c.tel)}" oninput="modifContact('${e.id}', 'tel', this.value)">
        <input type="email" placeholder="Mail" value="${esc(c.mail)}" oninput="modifContact('${e.id}', 'mail', this.value)">
      </div>
      <div class="ligne">
        <button class="orange petit" onclick="rappel('${e.id}', ${phase}, 'mail')">Rappel mail</button>
        <button class="orange petit" onclick="rappel('${e.id}', ${phase}, 'sms')">Rappel SMS</button>
        <button class="bleu petit" onclick="rappel('${e.id}', ${phase}, 'tel')">Appeler</button>
      </div>`;
  }

  const html = `<div class="etape ${classe}">
    <h4>${e.nom} ${quand}</h4>
    ${e.contenu ? `<p class="contenu">${e.contenu}</p>` : ""}
    ${alertes.length ? `<div class="alerte">⚠ ${alertes.join(", ")}</div>` : ""}
    <div class="ligne">
      <select onchange="setEtat('${e.id}', this.value)">${ETATS.map(x => `<option ${x === etat ? "selected" : ""}>${x}</option>`).join("")}</select>
      <input type="date" value="${d}" onchange="modifierDate('${e.id}', this.value)">
    </div>
    ${f.manuel[e.id] ? `<div><span class="modif">modifiée à la main</span> <button class="gris petit" onclick="remettreAuto('${e.id}')">Remettre la date auto</button></div>` : ""}
    ${resp}
  </div>`;
  return { d, html };
}

function listeEtapes(idDiv, etapes, ref, phase) {
  const f = fiche();
  let html = "", prec = "", secu = false;
  etapes.forEach(e => {
    if (e.secu && !secu) { html += '<div class="sous">Dossier sécurité (chef de projet)</div>'; secu = true; }
    if (!e.secu && secu) { html += '<hr style="margin-top:16px">'; secu = false; }
    const r = carte(f, e, ref, phase, prec);
    html += r.html;
    if (r.d) prec = r.d;
  });
  document.getElementById(idDiv).innerHTML = html;
}

/* ---------- Rappels (vouvoiement) ---------- */
function rappel(id, phase, type) {
  const f = fiche();
  const e = (phase === 1 ? PHASE1 : PHASE2).find(x => x.id === id);
  const d = dateEtape(f, e, phase === 1 ? f.remise : f.evenement);
  const c = f.contact[id] || {};
  const tel = (c.tel || "").replace(/\s/g, "");
  if (type === "mail" && !c.mail) { alert("Ajoutez d'abord le mail du responsable de cette étape."); return; }
  if (type !== "mail" && !tel) { alert("Ajoutez d'abord le téléphone du responsable de cette étape."); return; }
  if (type === "tel") { location.href = "tel:" + tel; return; }

  const sig = (phase === 1 ? f.ca : f.cp).nom || "";
  const projet = `« ${f.titre || "sans titre"} »${f.acheteur ? " (" + f.acheteur + ")" : ""}`;
  const bonjour = "Bonjour" + (c.nom ? " " + c.nom : "") + ",";
  const j = d ? ecart(d) : null;
  let sujet, corps;
  if (d && j < 0) {
    sujet = `URGENT – ${e.nom} en retard – ${f.titre || "marché"}`;
    corps = `URGENT : l'étape « ${e.nom} » du projet ${projet} devait être terminée le ${fr(d)} et elle est en retard. Pourriez-vous me tenir au courant au plus vite ?`;
  } else if (d && j <= f.delai) {
    sujet = `Rappel : ${e.nom} – échéance proche – ${f.titre || "marché"}`;
    corps = `L'étape « ${e.nom} » du projet ${projet} arrive à échéance le ${fr(d)}, ${j === 0 ? "c'est-à-dire aujourd'hui" : "dans " + j + " jour" + (j > 1 ? "s" : "")}. Pourriez-vous me confirmer qu'elle sera prête à temps ?`;
  } else {
    sujet = `Rappel : ${e.nom} – ${f.titre || "marché"}`;
    corps = `Je me permets de vous rappeler que l'étape « ${e.nom} » du projet ${projet} est prévue ${d ? "pour le " + fr(d) : "prochainement"}. Pourriez-vous me confirmer où vous en êtes ?`;
  }
  const texte = `${bonjour}\n\n${corps}\n\nBien cordialement,\n${sig}`.trim();
  if (type === "mail") {
    location.href = `mailto:${c.mail.trim()}?subject=${encodeURIComponent(sujet)}&body=${encodeURIComponent(texte)}`;
  } else {
    location.href = `sms:${tel}?&body=${encodeURIComponent(texte.replace(/\n\n/g, "\n"))}`;
  }
}

/* ---------- Affichage ---------- */
function dessiner() {
  const f = fiche();
  if (!f) return;
  listeEtapes("etapes1", PHASE1, f.remise, 1);
  const depotFini = ["Fait", "Validé"].includes(f.etat.depot);
  document.getElementById("avert1").innerHTML = !f.remise
    ? '<div class="avert">Indiquez la date de remise de l\'offre pour calculer les étapes.</div>'
    : (f.remise < auj() && !depotFini && f.resultat === "En cours" ? '<div class="avert">La date de remise est dépassée.</div>' : "");

  const gagne = f.resultat === "Gagné";
  document.getElementById("blocCP").style.display = gagne ? "block" : "none";
  document.getElementById("phase2").style.display = gagne ? "block" : "none";
  document.getElementById("info2").textContent = gagne ? "" : "La phase 2 et le chef de projet s'affichent quand le résultat passe à « Gagné » dans le bilan.";
  if (gagne) {
    listeEtapes("etapes2", PHASE2, f.evenement, 2);
    document.getElementById("avert2").innerHTML = !f.evenement
      ? '<div class="avert">Indiquez la date de l\'événement pour calculer les étapes.</div>'
      : (f.remise && f.evenement <= f.remise ? '<div class="avert">L\'événement est avant ou le jour de la remise des offres : vérifiez les dates.</div>' : "");
  }
}

function afficherListe() {
  const div = document.getElementById("liste");
  if (!fiches.length) { div.innerHTML = "<p>Aucune fiche pour le moment.</p>"; return; }
  div.innerHTML = fiches.map(f => `<div class="liste-fiche" onclick="ouvrir('${f.id}')">
    <strong>${esc(f.titre) || "Sans titre"}</strong><span class="statut">${f.resultat}</span><br>
    <small>${esc(f.acheteur)} — remise : ${fr(f.remise)}${f.evenement ? " — événement : " + fr(f.evenement) : ""}</small>
  </div>`).join("");
}

/* ---------- Démarrage ---------- */
try { fiches = JSON.parse(localStorage.getItem("fiches") || "[]"); } catch (e) { fiches = []; }
if (!Array.isArray(fiches)) fiches = [];
fiches = fiches.map(reparer);
sauver();

const p = new URLSearchParams(location.search);
if (p.get("titre")) {
  creer({ titre: p.get("titre") || "", acheteur: p.get("acheteur") || "",
          lien: p.get("lien") || "", remise: p.get("remise") || "" });
  history.replaceState(null, "", "projet.html");
} else {
  afficherListe();
}
</script>
