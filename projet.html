<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiches projet</title>
<style>
body{font-family:Arial,sans-serif;max-width:1000px;margin:auto;padding:15px;background:#f4f4f4}
h1,h2{color:#1a3d6d}h2{margin-top:0}
h3{background:#1a3d6d;color:#fff;padding:8px;border-radius:5px;margin-top:25px}
h4{color:#1a3d6d;border-bottom:2px solid #1a3d6d;padding-bottom:3px}
.carte{background:#fff;border-radius:8px;padding:15px;margin-bottom:20px;box-shadow:0 1px 4px #ccc}
label{display:block;margin-top:8px;font-weight:bold;font-size:14px}
input,textarea,select{width:100%;padding:6px;box-sizing:border-box;margin-top:3px;font-size:14px}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
button,.btn{background:#1a3d6d;color:#fff;border:none;padding:8px 12px;border-radius:5px;margin-top:8px;cursor:pointer;text-decoration:none;display:inline-block;font-size:14px}
button.suppr{background:#b22}
.etape{border:1px solid #ddd;border-radius:6px;padding:8px;margin:6px 0;background:#fff}
.titre{font-weight:bold;margin-bottom:4px}
.ligne{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
.urgent{background:#ff0000;color:#fff}
.retard{background:#000;color:#fff}
.manquant{background:#ff9800}
.fait{background:#e3f6e3}.fait .titre{text-decoration:line-through;color:#2a2}
.legende span{display:inline-block;padding:3px 8px;border-radius:4px;margin:3px;font-size:13px}
</style>
</head>
<body>
<a href="index.html">← Retour à la veille</a>
<h1>Fiches projet</h1>
<div class="legende"><span class="urgent">Moins de 7 jours</span>
<span class="retard">En retard</span><span class="manquant">Document manquant</span><span class="fait">Fait / Validé</span></div>
<style>@keyframes clign{50%{opacity:.25}}.clignote{animation:clign 1s infinite;background:#ffd600;color:#000;font-weight:bold}</style>

<div class="carte">
<button onclick="nouvelle()">+ Nouvelle fiche projet</button>
<div id="liste"></div>
</div>
<div id="fiche"></div>

<script>
const ETAPES=[
{p:1,t:"Préparation",poste:"Responsable chargé·e d'affaires",d:"Lecture du dossier de consultation (DCE) et du cahier des charges, visite du site.",j:-21},
{p:1,t:"Calculs",poste:"Responsable bureau d'études / ingénieur structure",d:"Demande des plans et des notes de calcul au bureau d'études, notes de calcul, descente de charges, plan d'implantation, étude au vent, validation par le bureau de contrôle.",j:-14},
{p:1,t:"Sécurité",poste:"Responsable QSE",d:"Dossier pour la commission de sécurité, habilitations et CACES des monteurs.",j:-10},
{p:1,t:"Pièces administratives",poste:"Responsable chargé·e d'affaires",d:"DC1 (lettre de candidature), DC2 ou DUME, Kbis de moins de 3 mois, attestation URSSAF, attestation de régularité fiscale, attestation d'assurance RC pro, attestation d'assurance décennale, RIB, références de chantiers similaires, certificats de qualification, acte d'engagement.",j:-7},
{p:1,t:"Offre technique et financière",poste:"Responsable chargé·e d'affaires et bureau d'études",d:"Mémoire technique, BPU ou DPGF, planning prévisionnel, liste du matériel et jalonnement (moyens humains).",j:-3},
{p:1,t:"Remise de l'offre",poste:"Responsable commercial",d:"",j:0},
{p:2,t:"Sécurité : réception du PGC du coordonnateur SPS",poste:"Responsable commercial",d:"",j:-30},
{p:2,t:"Sécurité : PPSPS rédigé",poste:"Responsable chef de chantier",d:"",j:-21},
{p:2,t:"Sécurité : plan de prévention signé",poste:"Responsable chef de chantier",d:"",j:-14},
{p:2,t:"Sécurité : procès-verbal de bon montage",poste:"Responsable chef de chantier et bureau de contrôle",d:"",j:-2},
{p:2,t:"Sécurité : passage de la commission de sécurité",poste:"Responsable QSE",d:"",j:-1},
{p:2,t:"Clôture : procès-verbal de réception par le client",poste:"Responsable chef de projet",d:"",j:1},
{p:2,t:"Clôture : facture envoyée",poste:"Responsable chef de projet",d:"",j:7},
{p:2,t:"Clôture : décompte final fait",poste:"Responsable chef de projet",d:"",j:30},
{p:2,t:"Clôture : retenue de garantie récupérée",poste:"Responsable chef de projet",d:"",j:365}
];
const ETATS=["À faire","En cours","Document manquant","Fait","Validé"];
let fiches=JSON.parse(localStorage.getItem("fichesProjet")||"[]");
let cur=null;
function save(){localStorage.setItem("fichesProjet",JSON.stringify(fiches));liste();}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function ajout(base,j){if(!base)return "";const d=new Date(base);d.setDate(d.getDate()+j);return d.toISOString().slice(0,10);}
function calc(f){f.etapes.forEach((e,i)=>{if(!e.manuel){e.date=ajout(ETAPES[i].p==1?f.remise:f.evenement,ETAPES[i].j);}});}
function nouvelle(){const f={id:Date.now(),nom:"Nouveau projet",client:"",remise:"",evenement:"",chef:{nom:"",tel:"",mail:""},etapes:ETAPES.map(e=>({etat:"À faire",date:"",manuel:false,poste:e.poste,nom:"",tel:"",mail:""})),bilan:{statut:"En cours",motif:"",commentaire:""}};fiches.push(f);save();ouvrir(f.id);}
function liste(){document.getElementById("liste").innerHTML=fiches.map(f=>`<p><a href="#" onclick="ouvrir(${f.id});return false">${esc(f.nom)}</a> — ${esc(f.bilan.statut)}</p>`).join("")||"<p>Aucune fiche pour l'instant.</p>";}
function classe(e){if(e.etat=="Fait"||e.etat=="Validé")return "fait";if(e.etat=="Document manquant")return "manquant";if(!e.date)return "";const n=(new Date(e.date)-new Date(new Date().toISOString().slice(0,10)))/86400000;if(n<0)return "retard";if(n<7)return "urgent";return "";}
function rappel(m,e,f,c){const d=e.date?new Date(e.date).toLocaleDateString("fr-FR"):"(date à préciser)";const b="Bonjour "+(e.nom||"")+",\n\n";const s="\n\nMerci d'avance.\nBien cordialement,\n"+(f.chef.nom||"")+(f.chef.tel?"\n"+f.chef.tel:"");
if(c=="retard")return {sujet:"URGENT – En retard : "+m.t+" – "+f.nom,mail:b+"L'étape « "+m.t+" » du projet "+f.nom+" devait être terminée le "+d+" et elle est maintenant en retard.\nPouvez-vous me dire où vous en êtes et me transmettre les documents au plus vite ?"+s,sms:"URGENT – "+f.nom+" : l'étape « "+m.t+" » est en retard (prévue le "+d+"). Merci de me rappeler."};
if(c=="urgent")return {sujet:"Rappel : "+m.t+" – échéance le "+d+" – "+f.nom,mail:b+"L'étape « "+m.t+" » du projet "+f.nom+" arrive à échéance le "+d+", dans moins de 7 jours.\nPouvez-vous me confirmer que ce sera prêt à temps ?"+s,sms:f.nom+" : l'étape « "+m.t+" » arrive à échéance le "+d+". Ce sera prêt à temps ?"};
return {sujet:"Rappel : "+m.t+" – "+f.nom,mail:b+"Petit rappel pour l'étape « "+m.t+" » du projet "+f.nom+", prévue le "+d+"."+s,sms:"Rappel "+f.nom+" : étape « "+m.t+" » prévue le "+d+"."};}
function ouvrir(id){cur=fiches.find(f=>f.id==id);afficher();}
function champ(lab,val,code){return `<label>${lab}<input value="${esc(val)}" onchange="${code}"></label>`;}
function afficher(){const f=cur;if(!f){document.getElementById("fiche").innerHTML="";return;}
let h=`<div class="carte"><h2>${esc(f.nom)}</h2><div class="grille">
${champ("Nom du projet",f.nom,"cur.nom=this.value;save();afficher()")}
${champ("Client",f.client,"cur.client=this.value;save()")}
<label>Date de remise de l'offre<input type="date" value="${f.remise}" onchange="cur.remise=this.value;calc(cur);save();afficher()"></label>
<label>Date de l'événement<input type="date" value="${f.evenement}" onchange="cur.evenement=this.value;calc(cur);save();afficher()"></label></div>
<h4>Chef de projet (responsable du dossier de A à Z)</h4><div class="grille">
${champ("Nom",f.chef.nom,"cur.chef.nom=this.value;save();afficher()")}
${champ("Téléphone",f.chef.tel,"cur.chef.tel=this.value;save();afficher()")}
${champ("Mail",f.chef.mail,"cur.chef.mail=this.value;save()")}</div>`;
[1,2].forEach(p=>{h+=`<h3>${p==1?"Phase 1 : Réponse à l'appel d'offres (calée sur la date de remise)":"Phase 2 : Marché gagné (calée sur la date de l'événement)"}</h3>`;
f.etapes.forEach((e,i)=>{const m=ETAPES[i];if(m.p!=p)return;const c=classe(e);const r=rappel(m,e,f,c);const cl=(c=="urgent"||c=="retard")?" clignote":"";
h+=`<div class="etape ${c}"><div class="titre">${esc(m.t)}</div>${m.d?`<div>${esc(m.d)}</div>`:""}
<div class="ligne"><label>État<select onchange="cur.etapes[${i}].etat=this.value;save();afficher()">${ETATS.map(s=>`<option${s==e.etat?" selected":""}>${s}</option>`).join("")}</select></label>
<label>Date${e.manuel?" (modifiée à la main)":""}<input type="date" value="${e.date}" onchange="cur.etapes[${i}].date=this.value;cur.etapes[${i}].manuel=true;save();afficher()"></label>
${champ("Poste",e.poste,`cur.etapes[${i}].poste=this.value;save()`)}
${champ("Nom du responsable",e.nom,`cur.etapes[${i}].nom=this.value;save();afficher()`)}
${champ("Téléphone",e.tel,`cur.etapes[${i}].tel=this.value;save();afficher()`)}
${champ("Mail",e.mail,`cur.etapes[${i}].mail=this.value;save();afficher()`)}</div>
<a class="btn${cl}" href="mailto:${esc(e.mail)}?subject=${encodeURIComponent(r.sujet)}&body=${encodeURIComponent(r.mail)}">Rappel mail</a>
<a class="btn${cl}" href="sms:${esc(e.tel)}?&body=${encodeURIComponent(r.sms)}">Rappel SMS</a></div>`;});});
h+=`<h3>Bilan</h3><div class="grille"><label>Résultat<select onchange="cur.bilan.statut=this.value;save()">${["En cours","Gagné","Perdu"].map(s=>`<option${s==f.bilan.statut?" selected":""}>${s}</option>`).join("")}</select></label>
<label>Motif<select onchange="cur.bilan.motif=this.value;save()">${["","Prix","Délai","Dossier incomplet","Autre"].map(s=>`<option${s==f.bilan.motif?" selected":""}>${s}</option>`).join("")}</select></label></div>
<label>Commentaire<textarea rows="3" onchange="cur.bilan.commentaire=this.value;save()">${esc(f.bilan.commentaire)}</textarea></label>
<button class="suppr" onclick="if(confirm('Supprimer cette fiche ?')){fiches=fiches.filter(x=>x.id!=cur.id);cur=null;save();afficher()}">Supprimer la fiche</button></div>`;
document.getElementById("fiche").innerHTML=h;}
liste();
</script>
</body>
</html>
